# Publica a app em https://ionsportbiz.app (ligada ao Supabase) e a demonstração em https://ionsportbiz.app/demo/.
# Requer, uma vez: Settings → Pages → Source: GitHub Actions, e Custom domain: ionsportbiz.app.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Endereço e caminho base vêm da configuração do Pages: https://ionsportbiz.app (domínio próprio)
      # ou https://rgvduarte.github.io/ionsportbiz enquanto o domínio não estiver ativo.
      - id: pages
        uses: actions/configure-pages@v5
      # Produção: ligada ao Supabase. A URL e a publishable key são públicas por natureza (a segurança está na RLS).
      - name: Build de produção
        run: npx vite build
        env:
          VITE_ROUTER: hash
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
          VITE_SUPABASE_URL: https://dutzetiryubhfthptrhb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AP_v8qs5A9X03ikN52lKvA_3v8AJv3T
      # Demonstração com dados fictícios (guardados só no browser), em /demo/.
      - name: Build da demonstração
        run: npx vite build --outDir dist/demo
        env:
          VITE_DEMO: '1'
          VITE_ROUTER: hash
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/demo/
          VITE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/demo
      # Os modelos .well-known têm valores por preencher (Team ID da Apple, SHA-256 da app Android).
      - run: rm -rf dist/.well-known dist/demo/.well-known
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
