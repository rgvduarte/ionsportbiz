# Publica a demonstração (dados fictícios, guardados só no browser) no GitHub Pages.
# Requer, uma vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build da demonstração
        run: npx vite build --sourcemap false
        env:
          VITE_DEMO: '1'
          VITE_ROUTER: hash
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Os modelos .well-known têm valores por preencher: não fazem sentido na demonstração.
      - run: rm -rf dist/.well-known
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
