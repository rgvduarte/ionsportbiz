# Publica a demonstração (dados fictícios, guardados só no browser) no GitHub Pages, em https://ionsportbiz.app.
# Requer, uma vez: Settings → Pages → Source: GitHub Actions, e Custom domain: ionsportbiz.app.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Endereço e caminho base vêm da configuração do Pages: https://ionsportbiz.app (domínio próprio)
      # ou https://rgvduarte.github.io/ionsportbiz enquanto o domínio não estiver ativo.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build da demonstração
        run: npx vite build --sourcemap false
        env:
          VITE_DEMO: '1'
          VITE_ROUTER: hash
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      # Os modelos .well-known têm valores por preencher: não fazem sentido na demonstração.
      - run: rm -rf dist/.well-known
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
